# Sobe PostgreSQL + API localmente:  docker compose up --build
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-model:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "ollama pull $${OLLAMA_MODEL:-llama3.2:3b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    volumes:
      - ollama-models:/root/.ollama

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: odr
      POSTGRES_USER: odr
      POSTGRES_PASSWORD: odr
    ports:
      - "5432:5432"
    volumes:
      - odr-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odr -d odr"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./Backend
    depends_on:
      db:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/odr
      DB_USER: odr
      DB_PASSWORD: odr
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      AI_READ_TIMEOUT: ${AI_READ_TIMEOUT:-120s}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"

volumes:
  odr-pgdata:
  ollama-models:
