# Sobe PostgreSQL + API localmente: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: odr
      POSTGRES_USER: odr
      POSTGRES_PASSWORD: odr
    ports:
      - "5432:5432"
    volumes:
      - odr-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odr -d odr"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./Backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/odr
      DB_USER: odr
      DB_PASSWORD: odr
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      AI_MODEL: ${AI_MODEL:-gemini-3.1-flash-lite}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.4}
      AI_CONNECT_TIMEOUT: ${AI_CONNECT_TIMEOUT:-5s}
      AI_READ_TIMEOUT: ${AI_READ_TIMEOUT:-60s}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-1}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"

volumes:
  odr-pgdata:
