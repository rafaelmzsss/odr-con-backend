spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/odr}
    username: ${DB_USER:odr}
    password: ${DB_PASSWORD:odr}
  jpa:
    show-sql: true

app:
  errors:
    include-details: true
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-this-value-32bytes-minimum}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
