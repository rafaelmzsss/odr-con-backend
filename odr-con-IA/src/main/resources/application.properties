spring.application.name=demo
server.port=8081

# Configuração do Spring AI + Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2:3b
spring.ai.ollama.chat.options.temperature=0.4

# Timeout caso a API demore > 5s
spring.http.client.connect-timeout=3s
spring.http.client.read-timeout=5s